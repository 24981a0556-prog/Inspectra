services:
  - type: web
    name: inspectra-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python render_start.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inspectra-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_UPLOAD_DIR
        value: /tmp/uploads
      - key: OCR_PROVIDER
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "https://inspectra.vercel.app,https://inspectra-frontend.vercel.app,https://inspectra-sih.vercel.app"
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: inspectra-db
    region: singapore
    plan: free
    databaseName: inspectra
    user: inspectra
